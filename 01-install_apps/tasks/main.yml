---
# основная задача роли - установка приложений и инструментов

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: Install network and system monitoring tools
  apt:
    name: "{{ item }}"
    state: present
  loop: "{{ monitoring_tools }}" 
  become: yes 
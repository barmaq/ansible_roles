---
# Список инструментов для мониторинга сети и системы
monitoring_tools:
  - fail2ban
  - iperf3
  - mtr
  - ethtool
  - tcpdump
  - duc
  - curl
  - arp-scan
  - htop
  - rsync
  - snmp
  - sysstat

# Пакеты, необходимые для установки Docker
docker_required_packages:
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release

# Пакеты Docker для установки
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# URL для загрузки GPG ключа Docker
docker_gpg_key_url: "https://download.docker.com/linux/debian/gpg" 